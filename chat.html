<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能咨询 · 法安智治</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .chat-wrapper { max-width: 800px; margin: 40px auto; background: white; border-radius: 24px; box-shadow: var(--shadow-md); overflow: hidden; display: flex; flex-direction: column; height: 75vh; }
        .chat-header { background: var(--primary-blue); color: white; padding: 20px 30px; }
        .chat-body { flex: 1; padding: 20px; overflow-y: auto; background: #f9fbfd; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 12px 20px; border-radius: 20px; word-break: break-word; animation: msgPop 0.3s ease; }
        .msg.user { align-self: flex-end; background: var(--primary-blue); color: white; }
        .msg.bot { align-self: flex-start; background: white; border: 1px solid var(--border-light); color: var(--text-dark); }
        .msg.warning { background: #fff3e0; border-left: 3px solid #ff9800; color: #5d4037; }
        .msg.info { background: #e3f2fd; border-left: 3px solid var(--primary-blue); color: #0d47a1; }
        .msg.article { background: #f1f8e9; border-left: 3px solid #4caf50; color: #2e7d32; }
        @keyframes msgPop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .chat-input-area { display: flex; padding: 15px; background: white; border-top: 1px solid var(--border-light); }
        .chat-input-area input { flex: 1; padding: 14px; border-radius: 30px; border: 1px solid var(--border-light); background: #f8fafc; outline: none; }
        .chat-input-area button { margin-left: 10px; background: var(--primary-blue); border: none; border-radius: 30px; padding: 0 25px; font-weight: 600; color: white; cursor: pointer; }
    </style>
</head>
<body>
<nav class="navbar"><div class="container">
    <a href=" " class="logo">法安智治 · 您的全能网络法治守护者</a >
    <ul class="nav-links" id="navLinks">
        <li><a href="home.html">首页</a ></li>
        <li><a href="law-center.html">普法中心</a ></li>
        <li><a href="chat.html">智能助手</a ></li>
    </ul>
    <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
</div></nav><div class="container">
    <div class="chat-wrapper">
        <div class="chat-header">
            <h2><i class="fas fa-robot"></i> 法安智治 AI 法律助手</h2>
            <p style="font-size:0.9rem; opacity:0.9;">内置风控检测与法律条文匹配 · 温暖陪伴</p >
        </div>
        <div class="chat-body" id="chatBody">
            <div class="msg bot">
                <strong>AI小安：</strong> 你好呀～ 我是你的贴心法律助手。遇到任何网络上的烦心事都可以告诉我，我会先帮你评估风险，然后查一查相关的法律条文，希望能帮到你 ❤️
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="描述你遇到的问题...">
            <button id="sendBtn"><i class="fas fa-paper-plane"></i> 发送</button>
        </div>
    </div>
</div><script>
    const body = document.getElementById('chatBody');
    const input = document.getElementById('chatInput');
    const send = document.getElementById('sendBtn');

    const riskDB = [
        { words: ['攻击','黑客','病毒','木马','漏洞利用'], level:'危险', desc:'涉及网络攻击' },
        { words: ['人肉','开盒','社工库','隐私泄露'], level:'警告', desc:'非法获取/公开他人隐私' },
        { words: ['自杀','自残','抑郁'], level:'注意', desc:'人身安全高危' },
        { words: ['诈骗','骗钱','转账'], level:'警告', desc:'电信网络诈骗' },
        { words: ['谣言','造谣','传谣'], level:'注意', desc:'散布谣言' },
        { words: ['网暴','辱骂','诽谤','网络暴力'], level:'注意', desc:'网络暴力/诽谤' },
    ];

    const lawDB = [
        { keys:['借钱','借款','借给','欠款','还钱','借了','资金周转','微信转账','朋友借'], conclusion:'仅凭微信聊天记录和转账凭证，可以起诉。', laws:[{article:'《民法典》第六百七十九条',content:'自然人之间的借款合同，自贷款人提供借款时成立。'},{article:'《民事诉讼法》第二十二条、第二十四条',content:'对公民提起的诉讼，由被告住所地人民法院管辖；合同纠纷也可由合同履行地法院管辖。'}], analysis:'你有明确借条内容和转账记录，证据较充分。', solution:'1. 整理聊天记录与转账凭证。2. 在兰州城关区法院起诉。3. 网上立案（人民法院在线服务）。', risk:'诉讼时效因你催款而中断，重新计算3年。' },
        { keys:['谣言','造谣','传谣'], conclusion:'涉嫌散布谣言，若未造成严重后果可行政处罚，严重可入刑。', laws:[{article:'《治安管理处罚法》第二十五条',content:'散布谣言处五日以上十日以下拘留，可并处五百元以下罚款。'}], analysis:'若只是转发未经核实的信息，责任较轻。', solution:'立即删除信息并发布澄清声明，保留原始发布者信息。', risk:'行政拘留风险。' },
        { keys:['网暴','辱骂','诽谤'], conclusion:'你有权要求对方停止侵害、赔礼道歉并赔偿精神损失。', laws:[{article:'《民法典》第一千零二十四条',content:'禁止用侮辱、诽谤等方式侵害他人名誉权。'}], analysis:'若你有截图证据，维权成功率高。', solution:'保存截图，向平台举报，向公安机关报案，可提起民事诉讼。', risk:'诉讼时效3年。' },
        { keys:['诈骗','骗钱','转账'], conclusion:'应立即报警并保留证据，追回可能性与报警速度相关。', laws:[{article:'《刑法》第二百六十六条',content:'诈骗公私财物，数额较大的，处三年以下有期徒刑、拘役或管制。'}], analysis:'你有聊天记录和转账凭证，有利。', solution:'拨打96110并前往派出所报案，提供所有证据。', risk:'资金可能已被转移，追回困难。' },
        { keys:['肖像权','盗用照片'], conclusion:'未经允许使用你照片，构成侵权，可要求停止侵害并索赔。', laws:[{article:'《民法典》第一千零一十九条',content:'未经同意不得制作、使用、公开他人肖像。'}], analysis:'你能证明照片是你本人即可。', solution:'截图保存证据，联系对方删除，向平台投诉，必要时起诉。', risk:'诉讼时效3年。' },
        { keys:['网购','假货','消费'], conclusion:'可要求退货退款并主张三倍赔偿（欺诈情形）。', laws:[{article:'《消费者权益保护法》第五十五条',content:'经营者有欺诈行为应退一赔三。'}], analysis:'有订单和支付记录就有力。', solution:'联系商家，向平台投诉，拨打12315，必要时起诉。', risk:'注意保留商品实物。' },
        { keys:['校园贷','学生贷'], conclusion:'非法校园贷违法，超高利息不受保护，暴力催收可报警。', laws:[{article:'《关于进一步加强校园贷规范管理工作的通知》',content:'严禁违规机构开展校园贷。'}], analysis:'若被威胁，属恶性事件。', solution:'停止借款，保留证据，向学校和警方求助。', risk:'可能面临人身威胁，立即报警。' },
        { keys:['赌博','网赌'], conclusion:'网赌违法，参与者可被治安处罚，开设赌场构成犯罪。', laws:[{article:'《刑法》第三百零三条',content:'赌博罪处三年以下有期徒刑。'}], analysis:'若仅参与可能行政处罚。', solution:'立即停止，向公安机关举报平台。', risk:'赌资不受保护，追回困难。' },
        { keys:['版权','盗版','抄袭'], conclusion:'他人侵权，你有权要求停止侵权并赔偿。', laws:[{article:'《著作权法》第四十八条',content:'未经许可传播作品应担责。'}], analysis:'有作品底稿可证明著作权。', solution:'保存侵权链接，向平台投诉，发函要求赔偿，起诉。', risk:'赔偿金额举证较难。' },
        { keys:['隐私泄露','个人信息','开盒','人肉'], conclusion:'严重侵权，可报警追究刑责及民事责任。', laws:[{article:'《刑法》第二百五十三条之一',content:'侵犯公民个人信息罪处三年以下有期徒刑。'}], analysis:'信息已被泄露，需立即固定证据。', solution:'截图报警，向网信办举报，可民事诉讼。', risk:'信息扩散越快危害越大，尽快行动。' }
    ];

    const defaultLaw = { conclusion:'建议收集证据进一步分析。', laws:[{article:'《民法典》',content:'依法维权。'}], analysis:'信息不足。', solution:'收集聊天记录、支付凭证等。', risk:'注意诉讼时效。' };

    function addMsg(text, className = 'bot') {
        const div = document.createElement('div');
        div.className = `msg ${className}`;
        div.innerHTML = text;
        body.appendChild(div);
        body.scrollTop = body.scrollHeight;
    }

    function analyzeRisk(text) {
        let result = { level:'安全', desc:'', words:[] };
        for (const rule of riskDB) {
            const found = rule.words.filter(w => text.includes(w));
            if (found.length > 0) {
                if (rule.level === '危险' || (rule.level === '警告' && result.level !== '危险') || (rule.level === '注意' && result.level !== '危险' && result.level !== '警告')) {
                    result = { level:rule.level, desc:rule.desc, words:found };
                }
            }
        }
        return result;
    }

    function cutKeywords(text) {
        const cleaned = text.replace(/[，。？！、；：“”‘’（）【】《》\s]/g, ' ');
        const words = cleaned.split(' ').filter(w => w.length >= 2);
        return [...new Set(words)];
    }

    function matchLaw(text) {
        const keywords = cutKeywords(text);
        let bestMatch = null, maxHits = 0;
        for (const item of lawDB) {
            let hits = 0;
            for (const key of item.keys) {
                if (keywords.some(w => w.includes(key) || key.includes(w))) hits++;
            }
            if (hits > maxHits) { maxHits = hits; bestMatch = item; }
        }
        return bestMatch || defaultLaw;
    }

    function checkInfoSufficiency(text) {
        const hasAmount = /(\d+万|\d+元|\d+块|\d{4,})/.test(text);
        const hasDate = /(\d{4}年|202[0-9]年|\d+月|\d+日|\d+号)/.test(text);
        const hasPlace = /(省|市|区|县|兰州|西安)/.test(text);
        const hasEvidence = /(聊天记录|转账|微信|借条|合同|录音|截图|凭证)/.test(text);
        return { hasAmount, hasDate, hasPlace, hasEvidence, score: (hasAmount?1:0)+(hasDate?1:0)+(hasPlace?1:0)+(hasEvidence?1:0) };
    }

    send.addEventListener('click', () => {
        const msg = input.value.trim();
        if (!msg) return;
        addMsg('<strong>你：</strong> ' + msg, 'user');
        input.value = '';
        setTimeout(() => {
            const risk = analyzeRisk(msg);
            let riskHtml = risk.level === '安全' ? '🤖 风控检测：未发现异常。' : `🤖 风控：检测到 <b>${risk.words.join('、')}</b>，风险等级：${risk.level}。`;
            addMsg(riskHtml, 'warning');

            const law = matchLaw(msg);
            const steps = [
                { title:'结论先行', content:law.conclusion, cls:'info' },
                { title:'法律依据', content: law.laws.map(l => `<b>${l.article}</b><br>${l.content}`).join('<br><br>'), cls:'article' },
                { title:'案情分析', content:law.analysis, cls:'info' },
                { title:'实操方案', content:law.solution, cls:'article' },
                { title:'风险提示', content:law.risk + '<br><small>⚠️ AI分析仅供参考，不构成法律意见。</small>', cls:'info' }
            ];
            let delay = 0;
            steps.forEach(step => {
                setTimeout(() => addMsg(`<div style="font-weight:bold;">📌 ${step.title}</div>${step.content}`, step.cls), delay);
                delay += 800;
            });
            setTimeout(() => {
                const info = checkInfoSufficiency(msg);
                if (info.score < 3) {
                    const missing = [];
                    if (!info.hasAmount) missing.push('金额');
                    if (!info.hasDate) missing.push('时间');
                    if (!info.hasPlace) missing.push('地点');
                    if (!info.hasEvidence) missing.push('证据类型');
                    if (missing.length) addMsg(`🤔 为更准确，请补充：${missing.join('、')}。`, 'info');
                } else {
                    addMsg('💡 信息较完整，可按上方方案操作。', 'bot');
                }
            }, delay + 500);
        }, 300);
    });

    input.addEventListener('keypress', e => { if (e.key === 'Enter') send.click(); });
    document.getElementById('menuToggle').addEventListener('click', () => {
        document.getElementById('navLinks').classList.toggle('active');
    });
</script>
</body>
</html>
