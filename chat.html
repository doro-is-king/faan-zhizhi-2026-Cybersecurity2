<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能咨询 · 法安智治</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .chat-full{max-width:800px;margin:40px auto;background:var(--glass-bg);backdrop-filter:blur(20px);border-radius:40px;overflow:hidden;display:flex;flex-direction:column;height:75vh;border:1px solid var(--glass-border);}
        .chat-header{background:linear-gradient(135deg,var(--primary),var(--accent));padding:24px 30px;color:white;}
        .chat-body{flex:1;padding:24px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;}
        .msg{max-width:75%;padding:14px 20px;border-radius:24px;animation:msgIn 0.4s ease;}
        .msg.user{align-self:flex-end;background:var(--primary);color:white;}
        .msg.bot{align-self:flex-start;background:var(--glass-bg);border:1px solid var(--glass-border);}
        @keyframes msgIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
        .chat-input{display:flex;padding:20px;gap:12px;background:rgba(0,0,0,0.2);}
        .chat-input input{flex:1;padding:16px;border-radius:60px;border:none;background:rgba(255,255,255,0.1);color:white;outline:none;}
        .chat-input button{background:linear-gradient(135deg,var(--orange),var(--pink));border:none;border-radius:60px;padding:0 25px;color:white;font-weight:600;cursor:pointer;}
    </style>
</head>
<body>
<nav class="navbar"><div class="container">
    <a href=" " class="logo">法安智治</a >
    <ul class="nav-links" id="navLinks">
    <li><a href=" " onclick="location.href='home.html';return false;">首页</a ></li>
    <li><a href="features.html" onclick="location.href='features.html';return false;">核心功能</a ></li>
    <li><a href="team.html" onclick="location.href='team.html';return false;">团队介绍</a ></li>
    <li><a href="plan.html" onclick="location.href='plan.html';return false;">实施规划</a ></li>
    <li><a href="chat.html" onclick="location.href='chat.html';return false;">智能咨询</a ></li>
</ul>
    <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
</div></nav><div class="container">
    <div class="chat-full">
        <div class="chat-header"><h2><i class="fas fa-robot"></i> 法安智治 AI 法律助手</h2></div>
        <div class="chat-body" id="chatBody">
            <div class="msg bot">你好！我是 AI 小安，可以问我网络侵权、纠纷调解流程等问题。</div>
        </div>
        <div class="chat-input">
            <input type="text" id="chatInput" placeholder="输入法律问题...">
            <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>
<script>
    const body=document.getElementById('chatBody'),input=document.getElementById('chatInput'),send=document.getElementById('sendBtn');
    function addMsg(text,isUser){
        const div=document.createElement('div');
        div.className='msg '+(isUser?'user':'bot');
        div.textContent=text;
        body.appendChild(div);
        body.scrollTop=body.scrollHeight;
    }
    send.addEventListener('click',()=>{
        const t=input.value.trim();if(!t)return;
        addMsg(t,true);input.value='';
        setTimeout(()=>{
            let r='感谢咨询。';
            if(t.includes('谣言'))r='谣言举报流程：收集证据→平台提交→多模态识别→固定存证→交相关部门处理。';
            else if(t.includes('侵权'))r='网络侵权可在线提交，平台匹配调解员，全程免费。';
            addMsg(r,false);
        },800);
    });
    input.addEventListener('keypress',e=>{if(e.key==='Enter')send.click();});
    // 移动端菜单
    document.getElementById('menuToggle').addEventListener('click',()=>{
        document.getElementById('navLinks').classList.toggle('active');
    });
</script>
</body>
</html>
