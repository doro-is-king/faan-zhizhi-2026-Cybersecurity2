<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>法安智治 · 欢迎</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center;
            background:linear-gradient(135deg,#0a0f1e 0%,#1a1f3a 30%,#2a1f3a 60%,#1a2f3a 100%);
            animation:bgShift 12s infinite alternate;}
        @keyframes bgShift{0%{background-position:0% 50%;}100%{background-position:100% 50%;}}
        .welcome-container{text-align:center;color:white;animation:fadeInUp 1.2s ease-out;}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
        .welcome-logo{font-size:5rem;font-weight:800;background:linear-gradient(135deg,#4b9eff,#d06eff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:20px;}
        .welcome-sub{font-size:1.8rem;font-weight:300;margin-bottom:50px;opacity:0.9;}
        .btn-enter{display:inline-block;padding:18px 50px;border-radius:80px;background:linear-gradient(145deg,#ff7b5a,#ff6b9d);color:white;font-size:1.4rem;font-weight:700;text-decoration:none;box-shadow:0 10px 30px rgba(255,107,157,0.4);transition:all 0.3s;cursor:pointer;animation:pulse 2s infinite;}
        .btn-enter:hover{transform:scale(1.08);box-shadow:0 15px 40px rgba(255,107,157,0.6);}
        @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,107,157,0.5);}70%{box-shadow:0 0 0 20px rgba(255,107,157,0);}100%{box-shadow:0 0 0 0 rgba(255,107,157,0);}}
    </style>
</head>
<body>
    <div class="welcome-container">
        <div class="welcome-logo">法安智治</div>
        <div class="welcome-sub">多模态·市域网络风险监测与调解一体化</div>
        <a href=" " class="btn-enter">✨ 欢迎进入</a >
    </div>
</body>
</html>
