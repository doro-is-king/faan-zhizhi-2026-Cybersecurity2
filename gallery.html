<!DOCTYPE html>
 <html lang="zh-CN">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>法安智治 - 图库</title>
     <link rel="stylesheet" href="style.css">
     <style>
         .gallery {
             display: flex;
             flex-wrap: wrap;
             gap: 15px;
             justify-content: center;
             padding: 20px;
         }
         .gallery img {
             width: 250px;
             height: 180px;
             object-fit: cover;
             border-radius: 8px;
             transition: transform 0.3s;
         }
         .gallery img:hover {
             transform: scale(1.05);
         }
         h1 { text-align: center; margin: 30px 0; }
         .back-link { text-align: center; margin: 20px; font-size: 18px; }
     </style>
 </head>
 <body>
     <h1>📷 法安智治图库</h1>
     
     <div class="gallery">
         <!-- 后面上传了图片，就把这里改成你图片的名字 -->
         <p style="text-align:center;">还没有图片，先去上传几张吧~</p >
     </div>
     <div class="back-link">
         <a href=" ">← 返回首页</a >
     </div>
 </body>
 </html>
