        .card-bg{position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at center,var(--card-color) 0%,transparent 70%);opacity:0;transition:opacity 0.5s;}
        .nav-card:hover .card-bg{opacity:0.15;}
