            text-decoration: none; color: var(--text); transition: 0.4s; cursor: pointer; position: relative;
        }
        .hex-item:hover { border-color: var(--neon-cyan); box-shadow: 0 0 40px rgba(0,255,255,0.3); transform: scale(1.05); }
        .hex-item i { font-size: 2.5rem; margin-bottom: 10px; }
