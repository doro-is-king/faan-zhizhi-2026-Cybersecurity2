        .timeline-v { position: relative; margin: 60px auto; max-width: 800px; }

        .tl-content { background: var(--surface); backdrop-filter: var(--blur); border: 1px solid var(--border); border-radius: 16px; padding: 20px; transition: 0.3s; }
        .tl-content:hover { border-color: var(--neon-cyan); box-shadow: 0 0 20px rgba(0,255,255,0.2); }
    </style>
